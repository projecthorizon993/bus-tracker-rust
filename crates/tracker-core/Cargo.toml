[package]
name = "tracker-core"
description = "Core library for bus tracking: providers, ETA engine, models"
edition = "2021"

[dependencies]
reqwest = { version = "0.11", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
thiserror = "1"
flate2 = "1"
zip = "2"
dirs = "5"
# AES decryption for VinBus ZIP (WinZip AES format)
aes = "0.8"
cipher = { version = "0.4", features = ["cbc"] }
sha2 = "0.10"