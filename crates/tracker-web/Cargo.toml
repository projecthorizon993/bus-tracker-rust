[package]
name = "tracker-web"
edition = "2021"

[dependencies]
tracker-core = { path = "../tracker-core" }
tracker-busmap = { path = "../tracker-busmap" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["add-extension"] }
log = "0.4"