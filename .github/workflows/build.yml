name: Build and Test

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release (all workspace crates)
        run: cargo build --release

      - name: Run tests
        run: cargo test --workspace

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check formatting
        run: cargo fmt --check

      - name: Upload tracker-cli binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: tracker-cli.exe
          path: target/release/tracker-cli.exe

      - name: Upload tracker-web binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: tracker-web.exe
          path: target/release/tracker-web.exe

      - name: Upload tracker-desktop binary artifact (if built)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracker-desktop.exe
          path: target/release/tracker-desktop.exe

      - name: Create release and upload binaries
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref }}
          files: |
            target/release/tracker-cli.exe
            target/release/tracker-web.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
