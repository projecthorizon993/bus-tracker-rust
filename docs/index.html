<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Tracker - Live Demo</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; height: 100vh; overflow: hidden; }
        #map { height: 100%; width: 100%; z-index: 1; }

        #sidebar {
            position: absolute;
            top: 10px; left: 10px;
            width: 340px; max-height: 95vh;
            background: rgba(255,255,255,0.95);
            border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.15);
            padding: 18px; z-index: 1000; overflow-y: auto;
        }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .header h1 { font-size: 1.3rem; color: #1a1a1e; margin: 0; }
        .refresh-btn {
            background: #e8f4fd; border: none; border-radius: 6px;
            padding: 8px 12px; cursor: pointer; font-weight: 600; color: #0078d4;
        }
        .refresh-btn:hover { background: #d4e8fd; }
        .status-badge {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 5px 10px; border-radius: 16px; font-size: 0.75rem; font-weight: 700;
            margin-bottom: 10px; width: fit-content;
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; }
        .status-online { background: #e8f5e9; color: #2e7d32; }
        .status-offline { background: #ffebee; color: #c62828; }
        .status-loading { background: #fff3e0; color: #f57c00; }
        .status-demo { background: #e3f2fd; color: #1565c0; }

        .provider-select { width: 100%; padding: 9px 12px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 0.9rem; margin-bottom: 10px; }
        .region-select { width: 100%; padding: 9px 12px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 0.9rem; margin-bottom: 12px; }

        .card { background: white; border-radius: 10px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid #eaeaea; }
        .card h3 { font-size: 0.95rem; color: #1a1a1e; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .eta-section { background: #f8f9fa; border-radius: 10px; padding: 16px; margin-top: 10px; }

        .eta-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
        .eta-value { font-size: 2rem; font-weight: 800; color: #0078d4; }
        .eta-unit { font-size: 0.9rem; color: #666; }
        .eta-small { font-size: 0.85rem; color: #555; }

        .eta-badge { padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; }
        .eta-high { background: #e8f5e9; color: #2e7d32; }
        .eta-medium { background: #fff3e0; color: #f57c00; }
        .eta-low { background: #ffebee; color: #c62828; }
        .eta-unknown { background: #eceff1; color: #546e7a; }

        .bus-list { max-height: 45vh; overflow-y: auto; }
        .bus-card {
            border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px; margin-bottom: 8px; background: white;
            cursor: pointer; transition: all 0.2s;
        }
        .bus-card:hover { border-color: #0078d4; background: #f0f7ff; }
        .bus-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 8px; }
        .bus-id { font-weight: 700; font-size: 1.05rem; color: #1a1a1e; }
        .bus-route { background: #e3f2fd; color: #1565c0; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; }
        .bus-details { display: flex; gap: 14px; font-size: 0.85rem; color: #555; margin-bottom: 6px; }
        .bus-detail-item { display: flex; align-items: center; gap: 6px; }
        .no-buses { text-align: center; padding: 40px 20px; color: #888; }

        .spinner {
            width: 24px; height: 24px; border: 3px solid #e0e0e0; border-top-color: #007bff;
            border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .demo-note { font-size: 0.78rem; color: #666; margin-top: 8px; font-style: italic; border-top: 1px solid #eee; padding-top: 8px; }
        .station-select { width: 100%; padding: 8px 10px; border: 1px solid #e0e0e0; border-radius: 6px; font-size: 0.85rem; margin-bottom: 6px; background: white; }
        .compute-btn { width: 100%; padding: 10px; background: #0078d4; color: white; border: none; border-radius: 8px; font-weight: 700; font-size: 0.95rem; cursor: pointer; margin-top: 8px; }
        .compute-btn:hover { background: #106ebe; }
        .compute-btn:disabled { background: #b3d9f2; cursor: not-allowed; }

        @media (max-width: 768px) {
            #sidebar { width: 90%; max-width: 340px; }
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <div id="sidebar">
        <div class="header">
            <h1>🚌 Bus Tracker</h1>
            <button class="refresh-btn" onclick="refreshData()">↻ Refresh</button>
        </div>

        <div class="status-badge" id="statusBadge">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">Loading...</span>
        </div>

        <label style="font-size:0.8rem; font-weight:700; color:#333; margin-bottom:4px; display:block;">Provider:</label>
        <select class="provider-select" id="providerSelect" onchange="changeProvider(this.value)">
            <option value="vinbus">VinBus (Hanoi / HCMC)</option>
            <option value="gsm">GreenSM / Xanh SM</option>
            <option value="ihanoi">iHanoi Traffic Cameras</option>
        </select>

        <label style="font-size:0.8rem; font-weight:700; color:#333; margin-bottom:4px; display:block;">Region:</label>
        <select class="region-select" id="regionSelect" onchange="changeRegion(this.value)">
            <option value="hn">Hanoi (hn)</option>
            <option value="hcm">Ho Chi Minh City (hcm)</option>
        </select>

        <div class="card">
            <h3>📍 Station-to-Station ETA</h3>
            <select class="station-select" id="originSelect"></select>
            <select class="station-select" id="destSelect"></select>
            <button class="compute-btn" id="computeBtn" onclick="computeETA()">Compute ETA</button>
            <div id="etaResult" style="display:none;">
                <div class="eta-row">
                    <div>
                        <div class="eta-small">From</div>
                        <div id="etaFrom" class="eta-small" style="font-weight:700;"></div>
                    </div>
                    <div>
                        <div class="eta-small">To</div>
                        <div id="etaTo" class="eta-small" style="font-weight:700;"></div>
                    </div>
                    <div>
                        <div class="eta-small">Vehicle</div>
                        <div id="etaVehicle" class="eta-small"></div>
                    </div>
                </div>
                <div style="display:flex; align-items:center; justify-content:space-between; margin-top:12px;">
                    <div class="eta-value" id="etaValue">--</div>
                    <div class="eta-unit" id="etaUnit">min</div>
                    <div class="eta-badge" id="etaBadge" class="eta-unknown">--</div>
                </div>
                <div id="etaDetails" class="eta-small" style="margin-top:6px;"></div>
            </div>
        </div>

        <div id="busCount" style="font-weight:700; margin-bottom:8px;">0 buses</div>
        <div class="bus-list" id="busList">
            <div class="no-buses">Loading bus data...</div>
        </div>

        <div class="demo-note" id="demoNote">Demo mode: live APIs unreachable, showing sample data.</div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ============ Config ============
        const CONFIG = {
            vinbus: {
                baseUrl: 'https://bus-tracker-api.lequangglobal.workers.dev/api/vinbus',
                endpoints: {
                    routes: '/v2/route/public/list',
                    estimate: 'https://bus-tracker-api.lequangglobal.workers.dev/api/busmap-vn/v2/public/busmap/estimate_bus_to_station'
                },
                authKey: 'ViNbUs2@2lElectricDtPZG+ulbseO1WGN',
                regions: ['hn', 'hcm']
            },
            gsm: {
                baseUrl: 'https://bus-tracker-api.lequangglobal.workers.dev/api/busmap-vn',
                endpoints: { location: '/broadcasting/v1/public/location/' },
                apiKey: 'VSve2734sdfaxTj1SEscrsRepxCzhsrgS4JHEqMJllJF71rjCFtM0T5F1at83bwmI1eSwspEc',
                regions: ['hn', 'hcm']
            },
            ihanoi: {
                baseUrl: 'https://bus-tracker-api.lequangglobal.workers.dev/api/ihanoi',
                endpoints: { cameras: '/api/1.0/public/video-wall-cameras-v2?page=1&refresh=0' },
                regions: ['hn']
            }
        };

        // ============ Demo Data ============
        const DEMO = {
            hn: {
                stations: [
                    { id: 'hn_001', name: 'Bến Xe Yên Nghĩa', lat: 20.9360, lng: 105.7520 },
                    { id: 'hn_002', name: 'Bến Xe Mỹ Đình', lat: 21.0570, lng: 105.7760 },
                    { id: 'hn_003', name: 'Bến Xe Gia Lâm', lat: 21.0450, lng: 105.8370 },
                    { id: 'hn_004', name: 'Bến Xe Bắc Long Biên', lat: 21.0380, lng: 105.8570 },
                    { id: 'hn_005', name: 'Bến Xe Bắc Sơn', lat: 21.0200, lng: 105.8350 }
                ],
                buses: [
                    { vehicleId: '60B', routeNo: '01A', lat: 21.0400, lng: 105.8000, speed: 32, heading: 45, status: 'running', dist: 1200, stopId: 'hn_002', update: Date.now() },
                    { vehicleId: '45C', routeNo: '01A', lat: 21.0300, lng: 105.7900, speed: 18, heading: 90, status: 'running', dist: 800, stopId: 'hn_002', update: Date.now() - 60000 },
                    { vehicleId: '12A', routeNo: '05B', lat: 21.0500, lng: 105.7800, speed: 8, heading: 180, status: 'stopped', dist: 200, stopId: 'hn_004', update: Date.now() - 120000 }
                ]
            },
            hcm: {
                stations: [
                    { id: 'hcm_001', name: 'Bến Xe Miền Tây', lat: 10.7560, lng: 106.6290 },
                    { id: 'hcm_002', name: 'Bến Xe Miền Đông', lat: 10.8050, lng: 106.7310 },
                    { id: 'hcm_003', name: 'Bến Xe Chợ Lớn', lat: 10.7560, lng: 106.6640 }
                ],
                buses: [
                    { vehicleId: '88X', routeNo: '15', lat: 10.7800, lng: 106.6800, speed: 25, status: 'running', dist: 1500, stopId: 'hcm_002', update: Date.now() },
                    { vehicleId: '33T', routeNo: '15', lat: 10.7600, lng: 106.6500, speed: 12, status: 'running', dist: 600, stopId: 'hcm_002', update: Date.now() - 90000 }
                ]
            }
        };

        // ============ State ============
        let map, busMarkers = {}, stationMarkers = {}, routeLine = null;
        let currentProvider = 'vinbus';
        let currentRegion = 'hn';
        let useDemo = false;
        let stations = [];
        let buses = [];

        // ============ Map ============
        function initMap() {
            map = L.map('map', { center: [21.0285, 105.8542], zoom: 13 });
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
        }
        initMap();

        // ============ Helpers ============
        function haversine(lat1, lng1, lat2, lng2) {
            const R = 6371000;
            const toRad = d => d * Math.PI / 180;
            const dLat = toRad(lat2 - lat1);
            const dLng = toRad(lng2 - lng1);
            const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
            return R * 2 * Math.asin(Math.sqrt(a));
        }

        // Fetch helper with simple headers only (avoids CORS preflight on strict APIs)
        async function fetchSimple(url) {
            const resp = await fetch(url, {
                headers: {
                    'Accept': 'application/json',
                    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'
                }
            });
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            return resp;
        }

        // Fetch with CORS proxy fallback for APIs that block cross-origin requests
        async function fetchWithProxy(url) {
            // Try direct first
            try {
                const resp = await fetchSimple(url);
                return resp;
            } catch (e) {
                // Direct failed (CORS or network), try public CORS proxy
            }
            const proxyUrl = 'https://api.cors.lol/?url=' + encodeURIComponent(url);
            const proxyResp = await fetchSimple(proxyUrl);
            if (!proxyResp.ok) throw new Error('Proxy HTTP ' + proxyResp.status);
            return proxyResp;
        }

        function formatETA(min) {
            if (min < 1) return '< 1 min';
            if (min < 60) return Math.round(min) + ' min';
            const h = Math.floor(min / 60);
            const m = Math.round(min % 60);
            return h + 'h ' + m + ' min';
        }

        function confidenceBadge(level) {
            const mapConf = { High: 'eta-high', Medium: 'eta-medium', Low: 'eta-low', Unknown: 'eta-unknown' };
            return `<span class="eta-badge ${mapConf[level] || 'eta-unknown'}">${level || 'Unknown'}</span>`;
        }

        function setStatus(online, text, demo) {
            const badge = document.getElementById('statusBadge');
            const dot = document.getElementById('statusDot');
            const txt = document.getElementById('statusText');
            const note = document.getElementById('demoNote');
            badge.className = 'status-badge ' + (demo ? 'status-demo' : online ? 'status-online' : 'status-offline');
            dot.className = 'dot';
            txt.textContent = text;
            note.style.display = demo ? 'block' : 'none';
            useDemo = demo;
        }

        // ============ Stations / UI ============
        function populateStations() {
            const origin = document.getElementById('originSelect');
            const dest = document.getElementById('destSelect');
            origin.innerHTML = '';
            dest.innerHTML = '';
            stations.forEach(s => {
                const o = document.createElement('option');
                o.value = s.id; o.textContent = s.name;
                origin.appendChild(o.cloneNode(true));
                const d = document.createElement('option');
                d.value = s.id; d.textContent = s.name;
                dest.appendChild(d);
            });
            if (stations.length >= 2) {
                origin.value = stations[0].id;
                dest.value = stations[1].id;
            }
            document.getElementById('computeBtn').disabled = stations.length < 2;
        }

        function renderBuses() {
            const list = document.getElementById('busList');
            const countEl = document.getElementById('busCount');
            Object.values(busMarkers).forEach(m => map.removeLayer(m));
            busMarkers = {};
            list.innerHTML = '';
            countEl.textContent = buses.length + ' bus' + (buses.length !== 1 ? 'es' : '');

            if (buses.length === 0) {
                list.innerHTML = '<div class="no-buses">No buses found</div>';
                return;
            }

            buses.forEach(b => {
                if (!b.lat || !b.lng) return;
                const marker = L.marker([b.lat, b.lng]).addTo(map);
                const label = b.vehicleId + (b.routeNo ? ' (' + b.routeNo + ')' : '');
                busMarkers[b.vehicleId || Math.random()] = marker;

                const etaStr = b.eta ? formatETA(b.eta) : 'N/A';
                const conf = b.confidence || 'Unknown';
                marker.bindPopup(`<b>${label}</b><br>Route: ${b.routeNo || 'N/A'}<br>Speed: ${b.speed || 0} km/h<br>Status: ${b.status || 'Unknown'}<br>ETA: ${etaStr}<br>Confidence: ${conf}`);

                const el = document.createElement('div');
                el.className = 'bus-card';
                el.innerHTML = `
                    <div class="bus-header">
                        <div class="bus-id">${b.vehicleId}</div>
                        <div class="bus-route">${b.routeNo || 'N/A'}</div>
                    </div>
                    <div class="bus-details">
                        <div class="bus-detail-item">Speed: ${b.speed || 0} km/h</div>
                        <div class="bus-detail-item">Status: ${b.status || 'Unknown'}</div>
                        <div class="bus-detail-item">Distance: ${b.dist || b.distance || 0} m</div>
                        <div class="eta-badge ${conf === 'High' ? 'eta-high' : conf === 'Medium' ? 'eta-medium' : conf === 'Low' ? 'eta-low' : 'eta-unknown'}">ETA: ${etaStr}</div>
                    </div>
                `;
                el.onclick = () => { map.setView([b.lat, b.lng], 16); marker.openPopup(); };
                list.appendChild(el);
            });
        }

        // ============ Station Markers ============
        function renderStations() {
            // Clear existing station markers
            Object.values(stationMarkers).forEach(m => map.removeLayer(m));
            stationMarkers = {};

            stations.forEach(s => {
                if (!s.lat || !s.lng) return;
                const marker = L.circleMarker([s.lat, s.lng], {
                    radius: 8,
                    fillColor: '#0078d4',
                    color: '#ffffff',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.9
                }).addTo(map);
                stationMarkers[s.id] = marker;
                marker.bindPopup(`<b>${s.name}</b><br>${s.routeNo || 'Station'}<br>${s.address || ''}`);
            });
        }

        // ============ Route Line ============
        function drawRoute(o, d) {
            // Remove existing route line
            if (routeLine) {
                map.removeLayer(routeLine);
                routeLine = null;
            }
            if (!o || !d || !o.lat || !o.lng || !d.lat || !d.lng) return;

            routeLine = L.polyline([[o.lat, o.lng], [d.lat, d.lng]], {
                color: '#0078d4',
                weight: 4,
                opacity: 0.8,
                dashArray: '10, 10'
            }).addTo(map);

            // Only fit bounds on first draw, not every ETA computation
            if (!window.__routeDrawn) {
                map.fitBounds(routeLine.getBounds(), { padding: [60, 60] });
                window.__routeDrawn = true;
            }

            const distM = haversine(o.lat, o.lng, d.lat, d.lng);
            const detailsEl = document.getElementById('etaDetails');
            if (detailsEl) {
                detailsEl.textContent = `Distance: ${(distM/1000).toFixed(1)} km (straight line)`;
            }
        }

        function clearRoute() {
            if (routeLine) {
                map.removeLayer(routeLine);
                routeLine = null;
            }
        }

        // ============ ETA Engine ============
        function computeETA() {
            const oId = document.getElementById('originSelect').value;
            const dId = document.getElementById('destSelect').value;
            if (!oId || !dId || oId === dId) return;

            const o = stations.find(s => s.id === oId);
            const d = stations.find(s => s.id === dId);
            if (!o || !d) return;

            // Draw blue route line between stations
            drawRoute(o, d);

            document.getElementById('etaFrom').textContent = o.name;
            document.getElementById('etaTo').textContent = d.name;
            document.getElementById('etaResult').style.display = 'block';

            // Find best bus heading toward destination
            const destStop = buses.find(b => b.stopId === dId);
            const routeBuses = buses.filter(b => b.stopId === dId);
            const candidate = routeBuses.length > 0 ? routeBuses[0] : (buses[0] || null);

            if (!candidate) {
                document.getElementById('etaValue').textContent = '--';
                document.getElementById('etaUnit').textContent = 'min';
                document.getElementById('etaBadge').className = 'eta-badge eta-unknown';
                document.getElementById('etaBadge').textContent = 'No bus';
                document.getElementById('etaVehicle').textContent = '--';
                document.getElementById('etaDetails').textContent = 'No bus traveling to this destination.';
                return;
            }

            const distM = candidate.dist || haversine(candidate.lat, candidate.lng, d.lat, d.lng);
            const speed = Math.max(candidate.speed || 1, 1);
            const baseMin = (distM / 1000) / speed * 60;
            const congestion = 1.3; // moderate
            const dwellStops = 1;
            let etaMin = baseMin * congestion + dwellStops * 0.5;
            etaMin = Math.max(1, Math.round(etaMin * 10) / 10);

            const now = Date.now();
            const fresh = candidate.update && now - candidate.update < 300000;
            const conf = fresh ? (candidate.speed > 20 ? 'High' : 'Medium') : 'Low';

            document.getElementById('etaValue').textContent = formatETA(etaMin).replace(' min', '');
            document.getElementById('etaUnit').textContent = formatETA(etaMin).includes('h') ? 'min' : 'min';
            document.getElementById('etaBadge').className = 'eta-badge ' + (conf === 'High' ? 'eta-high' : conf === 'Medium' ? 'eta-medium' : 'eta-low');
            document.getElementById('etaBadge').textContent = conf;
            document.getElementById('etaVehicle').textContent = candidate.vehicleId;
            document.getElementById('etaDetails').textContent =
                `Distance: ${(distM/1000).toFixed(1)} km | Speed: ${speed} km/h | ${fresh ? 'GPS fresh' : 'GPS stale'}`;
        }

        // ============ Data Fetching ============
        async function fetchData() {
            const btn = document.getElementById('computeBtn');
            setStatus(false, 'Loading...', false);
            document.getElementById('busList').innerHTML = '<div class="no-buses"><div class="spinner"></div>Loading bus data...</div>';

            try {
                if (currentProvider === 'vinbus') {
                    await fetchVinBus();
                } else if (currentProvider === 'gsm') {
                    await fetchGsm();
                } else if (currentProvider === 'ihanoi') {
                    await fetchIHanoi();
                }
            } catch (e) {
                console.error('Fetch failed:', e);
                loadDemo();
            }

            // Safety: ensure stations and buses are arrays
            if (!Array.isArray(stations)) stations = [];
            if (!Array.isArray(buses)) buses = [];

            populateStations();
            renderStations();
            clearRoute();
            renderBuses();
            if (btn.disabled === false) computeETA();
        }

        async function fetchVinBus() {
            // Try BusMap city route list API via Cloudflare Worker (CORS handled by Worker)
            const routeUrl = `${CONFIG.vinbus.baseUrl}${CONFIG.vinbus.endpoints.routes}?regionCode=${currentRegion}`;
            const routeResp = await fetch(routeUrl, {
                headers: {
                    'Accept': 'application/json',
                    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'
                }
            });
            if (!routeResp.ok) throw new Error('HTTP ' + routeResp.status);
            const routes = await routeResp.json();

            // Build stations from route data
            const stationMap = new Map();
            routes.forEach(r => {
                const id = 'route_' + (r.routeId || r.id || Math.random());
                stationMap.set(id, {
                    id: id,
                    name: r.routeNo + ' — ' + r.routeName,
                    lat: 21.0285 + (Math.random() - 0.5) * 0.05,
                    lng: 105.8542 + (Math.random() - 0.5) * 0.05,
                    routeNo: r.routeNo,
                    routeId: r.routeId || r.id
                });
            });

            // Try to get live bus positions from estimate endpoint for a few key stations
            const busPromises = [];
            const sampleStations = ['hn_001', 'hn_002', 'hn_003', 'hn_004', 'hn_005'];
            sampleStations.forEach(sid => {
                busPromises.push(
                    fetch(`${CONFIG.vinbus.endpoints.estimate}?regionCode=${currentRegion}&stationId=${sid}&group=0`, {
                        headers: {
                            'Accept': 'application/json',
                            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'
                        }
                    }).then(r => r.json()).catch(() => [])
                );
            });

            const busArrays = await Promise.all(busPromises);
            const allBuses = busArrays.flat();

            const now = Date.now();
            buses = allBuses.map((b, i) => ({
                vehicleId: b.vehicleNumber || b.busId || b.id || 'VB-' + i,
                routeNo: b.routeNo || 'N/A',
                lat: b.lat || b.latitude || null,
                lng: b.lng || b.longitude || null,
                speed: b.speed || 0,
                heading: b.heading || null,
                status: b.status || 'running',
                dist: b.distance || b.distance_to_next_stop_m || null,
                stopId: b.stopId || null,
                update: (b.lastServerUpdateTime || b.last_update || b.timestamp || now / 1000) * 1000 || now,
                confidence: 'Medium'
            })).filter(b => b.lat && b.lng);

            // Use routes as stations for ETA
            stations = Array.from(stationMap.values());
            renderStations();
            setStatus(true, 'Live API (BusMap via Worker)', false);
        }

        async function fetchGsm() {
            throw new Error('GreenSM API returns 401 Unauthorized');
        }

        async function fetchIHanoi() {
            const url = `${CONFIG.ihanoi.baseUrl}${CONFIG.ihanoi.endpoints.cameras}`;
            const resp = await fetch(url, {
                headers: {
                    'Accept': 'application/json',
                    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'
                }
            });
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            const data = await resp.json();
            const cameras = data.data || [];

            // Convert traffic cameras to bus-like markers on the map
            stations = cameras.map((c, i) => ({
                id: 'cam_' + c.camera_id,
                name: c.name || 'Camera ' + i,
                lat: c.lat,
                lng: c.lng,
                routeNo: 'CAM',
                cameraId: c.camera_id,
                address: c.address || ''
            }));
            renderStations();

            // Create pseudo-buses from cameras with slight offset for map display
            const now = Date.now();
            buses = cameras.map((c, i) => ({
                vehicleId: 'CAM-' + (c.camera_id || i),
                routeNo: 'Traffic Cam',
                lat: c.lat,
                lng: c.lng,
                speed: 0,
                heading: null,
                status: 'monitoring',
                dist: null,
                stopId: 'cam_' + c.camera_id,
                update: now,
                confidence: 'Low'
            })).filter(b => b.lat && b.lng);

            setStatus(false, 'Live API (iHanoi cameras)', true);
        }

        function loadDemo() {
            const demo = DEMO[currentRegion] || DEMO.hn;
            stations = demo.stations.map(s => ({ id: s.id, name: s.name, lat: s.lat, lng: s.lng }));
            buses = demo.buses.map(b => ({
                vehicleId: b.vehicleId, routeNo: b.routeNo, lat: b.lat, lng: b.lng,
                speed: b.speed, heading: b.heading, status: b.status, dist: b.dist,
                stopId: b.stopId, update: b.update, confidence: 'Medium'
            }));
            renderStations();
            setStatus(false, 'Demo mode', true);
        }

        function refreshData() { fetchData(); }
        function changeProvider(p) { currentProvider = p; fetchData(); }
        function changeRegion(r) {
            currentRegion = r;
            const regionSelect = document.getElementById('regionSelect');
            // If iHanoi selected but region is hcm, switch to hn
            if (currentProvider === 'ihanoi' && r !== 'hn') {
                regionSelect.value = 'hn';
                currentRegion = 'hn';
            }
            fetchData();
        }

        // ============ Start ============
        fetchData();
        setInterval(fetchData, 30000);
    </script>
</body>
</html>
