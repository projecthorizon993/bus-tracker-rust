<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Tracker - Live Demo</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; height: 100vh; overflow: hidden; }
        #map { height: 100%; width: 100%; z-index: 1; }

        #sidebar {
            position: absolute;
            top: 10px; left: 10px;
            width: 340px; max-height: 95vh;
            background: rgba(255,255,255,0.95);
            border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.15);
            padding: 18px; z-index: 500; overflow-y: auto;
        }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .header h1 { font-size: 1.3rem; color: #1a1a1e; margin: 0; }
        .refresh-btn {
            background: #e8f4fd; border: none; border-radius: 6px;
            padding: 8px 12px; cursor: pointer; font-weight: 600; color: #0078d4;
        }
        .refresh-btn:hover { background: #d4e8fd; }
        .status-badge {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 5px 10px; border-radius: 16px; font-size: 0.75rem; font-weight: 700;
            margin-bottom: 10px; width: fit-content;
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; }
        .status-online { background: #e8f5e9; color: #2e7d32; }
        .status-offline { background: #ffebee; color: #c62828; }
        .status-loading { background: #fff3e0; color: #f57c00; }
        .status-demo { background: #e3f2fd; color: #1565c0; }

        .provider-select { width: 100%; padding: 9px 12px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 0.9rem; margin-bottom: 10px; }
        .region-select { width: 100%; padding: 9px 12px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 0.9rem; margin-bottom: 12px; }

        .card { background: white; border-radius: 10px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid #eaeaea; }
        .card h3 { font-size: 0.95rem; color: #1a1a1e; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .eta-section { background: #f8f9fa; border-radius: 10px; padding: 16px; margin-top: 10px; }

        .eta-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
        .eta-value { font-size: 2rem; font-weight: 800; color: #0078d4; }
        .eta-unit { font-size: 0.9rem; color: #666; }
        .eta-small { font-size: 0.85rem; color: #555; }

        .eta-badge { padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; }
        .eta-high { background: #e8f5e9; color: #2e7d32; }
        .eta-medium { background: #fff3e0; color: #f57c00; }
        .eta-low { background: #ffebee; color: #c62828; }
        .eta-unknown { background: #eceff1; color: #546e7a; }

        .bus-list { max-height: 45vh; overflow-y: auto; }
        .bus-card {
            border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px; margin-bottom: 8px; background: white;
            cursor: pointer; transition: all 0.2s;
        }
        .bus-card:hover { border-color: #0078d4; background: #f0f7ff; }
        .bus-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 8px; }
        .bus-id { font-weight: 700; font-size: 1.05rem; color: #1a1a1e; }
        .bus-route { background: #e3f2fd; color: #1565c0; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; }
        .bus-details { display: flex; gap: 14px; font-size: 0.85rem; color: #555; margin-bottom: 6px; }
        .bus-detail-item { display: flex; align-items: center; gap: 6px; }
        .no-buses { text-align: center; padding: 40px 20px; color: #888; }

        .spinner {
            width: 24px; height: 24px; border: 3px solid #e0e0e0; border-top-color: #007bff;
            border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .demo-note { font-size: 0.78rem; color: #666; margin-top: 8px; font-style: italic; border-top: 1px solid #eee; padding-top: 8px; }
        .station-select { width: 100%; padding: 8px 10px; border: 1px solid #e0e0e0; border-radius: 6px; font-size: 0.85rem; margin-bottom: 6px; background: white; }
        .compute-btn { width: 100%; padding: 10px; background: #0078d4; color: white; border: none; border-radius: 8px; font-weight: 700; font-size: 0.95rem; cursor: pointer; margin-top: 8px; }
        .compute-btn:hover { background: #106ebe; }
        .compute-btn:disabled { background: #b3d9f2; cursor: not-allowed; }

        @media (max-width: 768px) {
            #sidebar { width: 90%; max-width: 340px; }
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <div id="sidebar">
        <div class="header">
            <h1>🚌 Bus Tracker</h1>
            <button class="refresh-btn" onclick="refreshData()">↻ Refresh</button>
            <button class="refresh-btn" onclick="centerMap()">⌖ Center</button>
        </div>

        <div class="status-badge" id="statusBadge">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">Loading...</span>
        </div>

        <div class="provider-select" id="regionSelect" onchange="changeRegion(this.value)">
            <option value="hn">Hanoi (hn)</option>
            <option value="hcm">Ho Chi Minh City (hcm)</option>
        </select>

        <label style="font-size:0.8rem; font-weight:700; color:#333; margin-bottom:4px; display:block;">Map style:</label>
        <select class="region-select" id="mapTypeSelect" onchange="changeMapType(this.value)">
            <option value="osm">OpenStreetMap</option>
            <option value="vietmap">Vietmap (Vietnam)</option>
            <option value="bing">Bing Maps</option>
            <option value="azure">Azure Maps</option>
        </select>

        <button class="compute-btn" onclick="testVinBusAPI()" style="width:100%;margin-top:8px;">Test Live API (VinBus)</button>

        <div class="card">

        <div class="card">
            <h3>📍 Station-to-Station ETA</h3>
            <select class="station-select" id="originSelect"></select>
            <select class="station-select" id="destSelect"></select>
            <button class="compute-btn" onclick="computeETA()">Compute ETA</button>
            <div id="etaResult" style="display:none;">
                <div class="eta-row">
                    <div>
                        <div class="eta-small">From</div>
                        <div id="etaFrom" class="eta-small" style="font-weight:700;"></div>
                    </div>
                    <div>
                        <div class="eta-small">To</div>
                        <div id="etaTo" class="eta-small" style="font-weight:700;"></div>
                    </div>
                    <div>
                        <div class="eta-small">Vehicle</div>
                        <div id="etaVehicle" class="eta-small"></div>
                    </div>
                </div>
                <div style="display:flex; align-items:center; justify-content:space-between; margin-top:12px;">
                    <div class="eta-value" id="etaValue">--</div>
                    <div class="eta-unit" id="etaUnit">min</div>
                    <div class="eta-badge" id="etaBadge" class="eta-unknown">--</div>
                </div>
                <div id="etaDetails" class="eta-small" style="margin-top:6px;"></div>
            </div>
        </div>
        </div>

        <div id="busCount" style="font-weight:700; margin-bottom:8px;">0 buses</div>
        <div class="bus-list" id="busList">
            <div class="no-buses">Loading bus data...</div>
        </div>

        <div class="demo-note" id="demoNote">Demo mode: live APIs unreachable, showing sample data.</div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ============ Config ============
        // HCMC EBMS API - free, no API key needed - LIVE bus GPS data!
        // OpenStreetMap Overpass API - free, no API key needed - bus routes & stops
        // Vietmap.vn / Bing Maps - better Vietnam map tiles (requires free API key, 60K free transactions/month)
        const CONFIG = {
            ebmsBase: 'https://apicms.ebms.vn',
            hcmcBounds: '106.60/10.70/106.80/10.90',
            apiKeyEndpoint: 'https://bus-tracker-api.lequangglobal.workers.dev/api/config',
            vinbusBase: 'http://www.timbus.vn:9149/SearchBuyt'
        };

// API keys (fetched from Cloudflare Worker at runtime - never hardcoded)
        let VIETMAP_API_KEY = ""
        let BING_MAPS_API_KEY = ""
        let AZURE_MAPS_KEY = ""

        async function loadApiKeys() {
            try {
                const resp = await fetch(CONFIG.apiKeyEndpoint, {
                    headers: { 'Accept': 'application/json' }
                })
                if (resp.ok) {
                    const data = await resp.json()
                    VIETMAP_API_KEY = data.vietmapApiKey || ''
                    BING_MAPS_API_KEY = data.bingMapsApiKey || ''
                    AZURE_MAPS_KEY = data.azureMapsSubscriptionKey || ''
                }
            } catch (e) {
                console.warn('Failed to load API keys from Worker:', e)
            }
        }

        // ============ VinBus API Encryption (from decompiled app er2.m()) ============
        function getChecksum(data) {
            let sum = 0
            for (let i = 0; i < data.length - 1; i++) {
                sum = (sum + data[i]) & 0xFF
            }
            return sum
        }

        function getRandomKey(minLen = 10, maxLen = 15) {
            const len = Math.floor(Math.random() * (maxLen - minLen + 1)) + minLen
            const key = new Uint8Array(len)
            for (let i = 0; i < len; i++) {
                key[i] = Math.floor(Math.random() * 80) + 48
            }
            return key
        }

        function buildVinBusPayload() {
    // Build payload: [random_int(4 bytes)] + [data_bytes]
    const routeData = new TextEncoder().encode('35B')
    const randInt = new Uint8Array(4)
    for (let i = 0; i < 4; i++) {
        randInt[i] = Math.floor(Math.random() * 256)
    }
    const payloadData = new Uint8Array(4 + routeData.length)
    payloadData.set(randInt, 0)
    payloadData.set(routeData, 4)

            // Generate random keys (10-15 bytes each)
            const key1Len = Math.floor(Math.random() * 6) + 10
            const key2Len = Math.floor(Math.random() * 6) + 10
            const key1 = new Uint8Array(key1Len)
            const key2 = new Uint8Array(key2Len)
            for (let i = 0; i < key1Len; i++) key1[i] = Math.floor(Math.random() * 80) + 48
            for (let i = 0; i < key2Len; i++) key2[i] = Math.floor(Math.random() * 80) + 48

            // Build bArr2 = key1 XOR key2, extended to max length
            const maxKeyLen = Math.max(key1Len, key2Len)
            const bArr2 = new Uint8Array(maxKeyLen)
            for (let i = 0; i < maxKeyLen; i++) {
                const k1 = i < key1Len ? key1[i] : 0
                const k2 = i < key2Len ? key2[i] : 0
                bArr2[i] = k1 ^ k2
            }

            // XOR payload data with bArr2 cyclically
            const encryptedData = new Uint8Array(payloadData.length)
            for (let i = 0; i < payloadData.length; i++) {
                encryptedData[i] = payloadData[i] ^ bArr2[i % bArr2.length]
            }

            // Build output buffer:
            // byte 0: key1_len
            // bytes 1-2: data_length (little endian)
            // byte 3: key2_len
            // bytes 4..4+key1_len-1: key1
            // bytes 4+key1_len..4+key1_len+key2_len-1: key2
            // remaining bytes: encrypted data XORed with bArr2 cyclically
            const output = new Uint8Array(4 + key1.length + key2.length + encryptedData.length)
            output[0] = key1Len
            output[1] = payloadData.length & 0xFF
            output[2] = (payloadData.length >> 8) & 0xFF
            output[3] = key2Len
            output.set(key1, 4)
            output.set(key2, 4 + key1Len)
            output.set(encryptedData, 4 + key1Len + key2Len)

            // Base64 encode
            return btoa(String.fromCharCode(...output))
        }

        async function callVinBusAPI(endpoint) {
            const encryptedPayload = buildVinBusPayload()
            const encodedPayload = encodeURIComponent(encryptedPayload)
            const url = `${CONFIG.vinbusBase}/${endpoint}?ReqParams=${encodedPayload}`
            try {
                const resp = await fetch(url)
                if (!resp.ok) throw new Error('HTTP ' + resp.status)
                return await resp.json()
            } catch (e) {
                console.warn('VinBus API error:', e)
                return null
            }
        }

        async function testVinBusAPI() {
            const encryptedPayload = buildVinBusPayload()
            const encodedPayload = encodeURIComponent(encryptedPayload)
            const url = `${CONFIG.vinbusBase}/RouteBuytOptionV3?ReqParams=${encodedPayload}`
            try {
                const resp = await fetch(url)
                if (!resp.ok) throw new Error('HTTP ' + resp.status)
                const data = await resp.json()
                document.getElementById('demoNote').textContent = `VinBus API test: SUCCESS! Response: ${JSON.stringify(data).substring(0, 200)}`
                document.getElementById('demoNote').style.color = '#2e7d32'
                return resp
            } catch (e) {
                console.error('VinBus API error:', e)
                document.getElementById('demoNote').textContent = `VinBus API error: ${e.message}`
                document.getElementById('demoNote').style.color = '#c62828'
                return null
            }
        }


        // ============ Demo Data ============
        const DEMO = {
            hn: {
                stations: [
                    { id: 'hn_001', name: 'Bến Xe Yên Nghĩa', lat: 20.9360, lng: 105.7520 },
                    { id: 'hn_002', name: 'Bến Xe Mỹ Đình', lat: 21.0570, lng: 105.7760 },
                    { id: 'hn_003', name: 'Bến Xe Gia Lâm', lat: 21.0450, lng: 105.8370 },
                    { id: 'hn_004', name: 'Bến Xe Bắc Long Biên', lat: 21.0380, lng: 105.8570 },
                    { id: 'hn_005', name: 'Bến Xe Bắc Sơn', lat: 21.0200, lng: 105.8350 }
                ],
                buses: [
                    { vehicleId: '60B', routeNo: '01A', lat: 21.0400, lng: 105.8000, speed: 32, heading: 45, status: 'running', dist: 1200, stopId: 'hn_002', update: Date.now() },
                    { vehicleId: '45C', routeNo: '01A', lat: 21.0300, lng: 105.7900, speed: 18, heading: 90, status: 'running', dist: 800, stopId: 'hn_002', update: Date.now() - 60000 },
                    { vehicleId: '12A', routeNo: '05B', lat: 21.0500, lng: 105.7800, speed: 8, heading: 180, status: 'stopped', dist: 200, stopId: 'hn_004', update: Date.now() - 120000 }
                ]
            },
            hcm: {
                stations: [
                    { id: 'hcm_001', name: 'Bến Xe Miền Tây', lat: 10.7560, lng: 106.6290 },
                    { id: 'hcm_002', name: 'Bến Xe Miền Đông', lat: 10.8050, lng: 106.7310 },
                    { id: 'hcm_003', name: 'Bến Xe Chợ Lớn', lat: 10.7560, lng: 106.6640 }
                ],
                buses: [
                    { vehicleId: '88X', routeNo: '15', lat: 10.7800, lng: 106.6800, speed: 25, status: 'running', dist: 1500, stopId: 'hcm_002', update: Date.now() },
                    { vehicleId: '33T', routeNo: '15', lat: 10.7600, lng: 106.6500, speed: 12, status: 'running', dist: 600, stopId: 'hcm_002', update: Date.now() - 90000 }
                ]
            }
        };

        // ============ State ============
        let map, busMarkers = {}, stationMarkers = {}, routeLine = null;
        let currentRegion = 'hn';
        let mapType = 'osm'; // 'osm', 'vietmap', 'bing', or 'azure'
        let useDemo = false;
        let stations = [];
        let buses = [];

        // ============ Map ============
        function initMap() {
            map = L.map('map', { center: [10.78, 106.68], zoom: 13 });

            if (mapType === 'vietmap') {
                loadVietmapLayer();
            } else if (mapType === 'bing') {
                loadBingMapsLayer();
            } else if (mapType === 'azure') {
                loadAzureMapsLayer();
            } else {
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© <a href="https://openstreetmap.org" target="_blank" rel="noopener">OpenStreetMap</a> contributors | Bản đồ: © OpenStreetMap',
                    maxZoom: 19
                }).addTo(map);
            }
        }

        async function loadVietmapLayer() {
            if (!VIETMAP_API_KEY) {
                console.warn('Vietmap API key not configured. Falling back to OpenStreetMap.');
                mapType = 'osm';
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© <a href="https://openstreetmap.org" target="_blank" rel="noopener">OpenStreetMap</a> contributors | Bản đồ: © OpenStreetMap',
                    maxZoom: 19
                }).addTo(map);
                return;
            }
            L.tileLayer(`https://tiles.vietmap.vn/v1/raster/tiles/{z}/{x}/{y}.png?apikey=${VIETMAP_API_KEY}`, {
                attribution: '© <a href="https://maps.vietmap.vn" target="_blank" rel="noopener">VIETMAP</a> | Bản đồ: © VIETMAP',
                maxZoom: 19
            }).addTo(map);
        }

        async function loadBingMapsLayer() {
            if (!BING_MAPS_API_KEY) {
                console.warn('Bing Maps API key not configured. Falling back to OpenStreetMap.');
                mapType = 'osm';
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© <a href="https://openstreetmap.org" target="_blank" rel="noopener">OpenStreetMap</a> contributors | Bản đồ: © OpenStreetMap',
                    maxZoom: 19
                }).addTo(map);
                return;
            }
            L.tileLayer(`https://dev.virtualearth.net/REST/V1/Imagery/Map/Road/{z}/{x}/{y}?key=${BING_MAPS_API_KEY}&o=1`, {
                attribution: '© <a href="https://www.bing.com/maps" target="_blank" rel="noopener">Bing Maps</a> | Bản đồ: © Bing Maps',
                maxZoom: 19
            }).addTo(map);
        }

        async function loadAzureMapsLayer() {
            if (!AZURE_MAPS_KEY) {
                console.warn('Azure Maps subscription key not configured. Falling back to OpenStreetMap.');
                mapType = 'osm';
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© <a href="https://openstreetmap.org" target="_blank" rel="noopener">OpenStreetMap</a> contributors | Bản đồ: © OpenStreetMap',
                    maxZoom: 19
                }).addTo(map);
                return;
            }
            // Azure Maps tile layer (subscription key)
            L.tileLayer(`https://atlas.microsoft.com/map/tile?layer=road&api-version=1.0&style=main&tileSize=256&language=en-US&x={x}&y={y}&z={z}&subscription-key=${AZURE_MAPS_KEY}`, {
                attribution: '© <a href="https://azure.microsoft.com/en-us/products/azure-maps/" target="_blank" rel="noopener">Azure Maps</a> | Bản đồ: © Azure Maps',
                maxZoom: 19
            }).addTo(map);
        }
        // Load API keys from Worker before initializing map
        loadApiKeys().then(() => initMap());

        // ============ Helpers ============
        function haversine(lat1, lng1, lat2, lng2) {
            const R = 6371000;
            const toRad = d => d * Math.PI / 180;
            const dLat = toRad(lat2 - lat1);
            const dLng = toRad(lng2 - lng1);
            const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
            return R * 2 * Math.asin(Math.sqrt(a));
        }

        // Fetch helper with simple headers only (avoids CORS preflight on strict APIs)
        async function fetchSimple(url) {
            const resp = await fetch(url, {
                headers: {
                    'Accept': 'application/json',
                    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'
                }
            });
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            return resp;
        }

        // Fetch with CORS proxy fallback for APIs that block cross-origin requests
        async function fetchWithProxy(url) {
            // Try direct first
            try {
                const resp = await fetchSimple(url);
                return resp;
            } catch (e) {
                // Direct failed (CORS or network), try public CORS proxy
            }
            const proxyUrl = 'https://api.cors.lol/?url=' + encodeURIComponent(url);
            const proxyResp = await fetchSimple(proxyUrl);
            if (!proxyResp.ok) throw new Error('Proxy HTTP ' + proxyResp.status);
            return proxyResp;
        }

        function formatETA(min) {
            if (min < 1) return '< 1 min';
            if (min < 60) return Math.round(min) + ' min';
            const h = Math.floor(min / 60);
            const m = Math.round(min % 60);
            return h + 'h ' + m + ' min';
        }

        function confidenceBadge(level) {
            const mapConf = { High: 'eta-high', Medium: 'eta-medium', Low: 'eta-low', Unknown: 'eta-unknown' };
            return `<span class="eta-badge ${mapConf[level] || 'eta-unknown'}">${level || 'Unknown'}</span>`;
        }

        function setStatus(online, text, demo) {
            const badge = document.getElementById('statusBadge');
            const dot = document.getElementById('statusDot');
            const txt = document.getElementById('statusText');
            const note = document.getElementById('demoNote');
            badge.className = 'status-badge ' + (demo ? 'status-demo' : online ? 'status-online' : 'status-offline');
            dot.className = 'dot';
            txt.textContent = text;
            note.style.display = demo ? 'block' : 'none';
            useDemo = demo;
        }

        // ============ Stations / UI ============
        function populateStations() {
            const origin = document.getElementById('originSelect');
            const dest = document.getElementById('destSelect');
            origin.innerHTML = '';
            dest.innerHTML = '';
            stations.forEach(s => {
                const o = document.createElement('option');
                o.value = s.id; o.textContent = s.name;
                origin.appendChild(o.cloneNode(true));
                const d = document.createElement('option');
                d.value = s.id; d.textContent = s.name;
                dest.appendChild(d);
            });
            if (stations.length >= 2) {
                origin.value = stations[0].id;
                dest.value = stations[1].id;
            }
            document.getElementById('computeBtn').disabled = stations.length < 2;
        }

        function renderBuses() {
            const list = document.getElementById('busList');
            const countEl = document.getElementById('busCount');
            Object.values(busMarkers).forEach(m => map.removeLayer(m));
            busMarkers = {};
            list.innerHTML = '';
            countEl.textContent = buses.length + ' bus' + (buses.length !== 1 ? 'es' : '');

            if (buses.length === 0) {
                list.innerHTML = '<div class="no-buses">No buses found</div>';
                return;
            }

            buses.forEach(b => {
                if (!b.lat || !b.lng) return;
                const marker = L.marker([b.lat, b.lng]).addTo(map);
                const label = b.vehicleId + (b.routeNo ? ' (' + b.routeNo + ')' : '');
                busMarkers[b.vehicleId || Math.random()] = marker;

                const etaStr = b.eta ? formatETA(b.eta) : 'N/A';
                const conf = b.confidence || 'Unknown';
                marker.bindPopup(`<b>${label}</b><br>Route: ${b.routeNo || 'N/A'}<br>Speed: ${b.speed || 0} km/h<br>Status: ${b.status || 'Unknown'}<br>ETA: ${etaStr}<br>Confidence: ${conf}`);

                const el = document.createElement('div');
                el.className = 'bus-card';
                el.innerHTML = `
                    <div class="bus-header">
                        <div class="bus-id">${b.vehicleId}</div>
                        <div class="bus-route">${b.routeNo || 'N/A'}</div>
                    </div>
                    <div class="bus-details">
                        <div class="bus-detail-item">Speed: ${b.speed || 0} km/h</div>
                        <div class="bus-detail-item">Status: ${b.status || 'Unknown'}</div>
                        <div class="bus-detail-item">Distance: ${b.dist || b.distance || 0} m</div>
                        <div class="eta-badge ${conf === 'High' ? 'eta-high' : conf === 'Medium' ? 'eta-medium' : conf === 'Low' ? 'eta-low' : 'eta-unknown'}">ETA: ${etaStr}</div>
                    </div>
                `;
                el.onclick = () => { map.setView([b.lat, b.lng], 16); marker.openPopup(); };
                list.appendChild(el);
            });
        }

        // ============ Station Markers ============
        function renderStations() {
            stations.forEach(s => {
                if (!s.lat || !s.lng) return;
                const key = s.id;
                if (stationMarkers[key]) {
                    // Update existing marker position
                    stationMarkers[key].setLatLng([s.lat, s.lng]);
                    return;
                }
                const marker = L.circleMarker([s.lat, s.lng], {
                    radius: 8,
                    fillColor: '#0078d4',
                    color: '#ffffff',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.9
                }).addTo(map);
                stationMarkers[key] = marker;
                marker.bindPopup(`<b>${s.name}</b><br>${s.routeNo || 'Station'}<br>${s.address || ''}`);
            });
            // Remove markers for stations no longer in list
            Object.keys(stationMarkers).forEach(key => {
                if (!stations.find(s => s.id === key)) {
                    map.removeLayer(stationMarkers[key]);
                    delete stationMarkers[key];
                }
            });
        }

        // ============ Route Line ============
        function drawRoute(o, d) {
            // Remove existing route line
            if (routeLine) {
                map.removeLayer(routeLine);
                routeLine = null;
            }
            if (!o || !d || !o.lat || !o.lng || !d.lat || !d.lng) return;

            routeLine = L.polyline([[o.lat, o.lng], [d.lat, d.lng]], {
                color: '#0078d4',
                weight: 4,
                opacity: 0.8,
                dashArray: '10, 10'
            }).addTo(map);

            // Only fit bounds on first draw, not every ETA computation
            if (!window.__routeDrawn) {
                map.fitBounds(routeLine.getBounds(), { padding: [60, 60] });
                window.__routeDrawn = true;
            }

            const distM = haversine(o.lat, o.lng, d.lat, d.lng);
            const detailsEl = document.getElementById('etaDetails');
            if (detailsEl) {
                detailsEl.textContent = `Distance: ${(distM/1000).toFixed(1)} km (straight line)`;
            }
        }

        function clearRoute() {
            if (routeLine) {
                map.removeLayer(routeLine);
                routeLine = null;
            }
        }

        // ============ ETA Engine ============
        function computeETA() {
            const oId = document.getElementById('originSelect').value;
            const dId = document.getElementById('destSelect').value;
            if (!oId || !dId || oId === dId) return;

            const o = stations.find(s => s.id === oId);
            const d = stations.find(s => s.id === dId);
            if (!o || !d) return;

            // Draw blue route line between stations
            drawRoute(o, d);

            document.getElementById('etaFrom').textContent = o.name;
            document.getElementById('etaTo').textContent = d.name;
            document.getElementById('etaResult').style.display = 'block';

            // Find best bus heading toward destination
            const destStop = buses.find(b => b.stopId === dId);
            const routeBuses = buses.filter(b => b.stopId === dId);
            const candidate = routeBuses.length > 0 ? routeBuses[0] : (buses[0] || null);

            if (!candidate) {
                document.getElementById('etaValue').textContent = '--';
                document.getElementById('etaUnit').textContent = 'min';
                document.getElementById('etaBadge').className = 'eta-badge eta-unknown';
                document.getElementById('etaBadge').textContent = 'No bus';
                document.getElementById('etaVehicle').textContent = '--';
                document.getElementById('etaDetails').textContent = 'No bus traveling to this destination.';
                return;
            }

            const distM = candidate.dist || haversine(candidate.lat, candidate.lng, d.lat, d.lng);
            const speed = Math.max(candidate.speed || 1, 1);

            // ETA using haversine distance + bus speed + congestion factor
            const baseMin = (distM / 1000) / speed * 60;
            const congestion = 1.3; // moderate congestion
            const dwellStops = 1;
            let etaMin = baseMin * congestion + dwellStops * 0.5;
            etaMin = Math.max(1, Math.round(etaMin * 10) / 10);

            const now = Date.now();
            const fresh = candidate.update && now - candidate.update < 300000;
            const conf = fresh ? (candidate.speed > 20 ? 'High' : 'Medium') : 'Low';

            document.getElementById('etaValue').textContent = formatETA(etaMin).replace(' min', '');
            document.getElementById('etaUnit').textContent = formatETA(etaMin).includes('h') ? 'min' : 'min';
            document.getElementById('etaBadge').className = 'eta-badge ' + (conf === 'High' ? 'eta-high' : conf === 'Medium' ? 'eta-medium' : 'eta-low');
            document.getElementById('etaBadge').textContent = conf;
            document.getElementById('etaVehicle').textContent = candidate.vehicleId;

            const distKm = distM / 1000;
            document.getElementById('etaDetails').textContent =
                `Distance: ${distKm.toFixed(1)} km | Speed: ${speed} km/h | ${fresh ? 'GPS fresh' : 'GPS stale'}`;
        }

        // ============ Data Fetching (EBMS API - HCMC live bus data, free, no key) ============
        async function fetchData() {
            const btn = document.getElementById('computeBtn');
            setStatus(false, 'Loading...', false);
            document.getElementById('busList').innerHTML = '<div class="no-buses"><div class="spinner"></div>Loading from HCMC EBMS API...</div>';
            window.__routeDrawn = false;

            let stations = [];
            let buses = [];
            let live = false;

            // HCMC only - EBMS API works for HCMC
            if (currentRegion === 'hcm') {
                try {
                    const result = await fetchEBMSData();
                    stations = result.stations || [];
                    buses = result.buses || [];
                    live = result.live || false;
                } catch (e) {
                    console.error('EBMS fetch error:', e);
                }
            }

            // Fallback to demo if no live data or wrong region
            if (!live || buses.length === 0) {
                loadDemo();
                setStatus(false, 'Demo mode', true);
            } else {
                setStatus(true, 'Live API (HCMC EBMS)', false);
            }

            // Safety: ensure stations and buses are arrays
            if (!Array.isArray(stations)) stations = [];
            if (!Array.isArray(buses)) buses = [];

            populateStations();
            renderStations();
            clearRoute();
            renderBuses();
            if (btn.disabled === false) computeETA();
        }

        // ---- EBMS API (HCMC - live bus GPS, free, no key) ----
        async function fetchEBMSData() {
            const bounds = CONFIG.ebmsBase + '/businfo/getstopsinbounds/' + CONFIG.hcmcBounds;

            try {
                const resp = await fetch(bounds, {
                    headers: { 'Accept': 'application/json', 'User-Agent': 'Mozilla/5.0' }
                });
                if (!resp.ok) return { stations: [], buses: [], live: false };

                const stops = await resp.json();

                // Build station list from EBMS data
                const stationMap = new Map();
                stops.forEach(s => {
                    stationMap.set('ebms_' + s.StopId, {
                        id: 'ebms_' + s.StopId,
                        name: s.Name || 'Bus Stop',
                        lat: s.Lat,
                        lng: s.Lng,
                        routeNo: s.Routes || 'N/A',
                        stopId: s.StopId.toString(),
                        address: s.AddressNo || '',
                        region: s.Zone || ''
                    });
                });

                // Fetch live bus positions for each stop
                const busPromises = [];
                const stopIds = Array.from(stationMap.keys()).slice(0, 20); // limit to 20 stops
                stopIds.forEach(stopKey => {
                    const stop = stationMap.get(stopKey);
                    busPromises.push(
                        fetch(`${CONFIG.ebmsBase}/prediction/predictbystopid/${stop.stopId}`, {
                            headers: { 'Accept': 'application/json', 'User-Agent': 'Mozilla/5.0' }
                        }).then(r => r.json()).catch(() => null)
                    );
                });

                const busResults = await Promise.all(busPromises);

                const allBuses = [];
                busResults.forEach((result, idx) => {
                    if (!result || !result.arrs) return;
                    const stopKey = stopIds[idx];
                    const stop = stationMap.get(stopKey);
                    result.arrs.forEach(a => {
                        allBuses.push({
                            vehicleId: a.v || 'Unknown',
                            routeNo: a.rNo || stop.routeNo || 'N/A',
                            routeName: a.rN || stop.name || 'Unknown',
                            lat: stop.lat,
                            lng: stop.lng,
                            speed: a.s || 0,
                            status: 'running',
                            dist: a.d || 0,
                            stopId: stopKey,
                            update: new Date(a.dts).getTime() / 1000 || 0,
                            confidence: 'Medium',
                            source: 'EBMS'
                        });
                    });
                });

                return {
                    stations: Array.from(stationMap.values()),
                    buses: allBuses.filter(b => b.lat && b.lng),
                    live: allBuses.length > 0
                };
            } catch (e) {
                console.error('EBMS error:', e);
                return { stations: [], buses: [], live: false };
            }
        }

        function loadDemo() {
            const demo = DEMO[currentRegion] || DEMO.hn;
            stations = demo.stations.map(s => ({ id: s.id, name: s.name, lat: s.lat, lng: s.lng }));
            buses = demo.buses.map(b => ({
                vehicleId: b.vehicleId, routeNo: b.routeNo, lat: b.lat, lng: b.lng,
                speed: b.speed, heading: b.heading, status: b.status, dist: b.dist,
                stopId: b.stopId, update: b.update, confidence: 'Medium'
            }));
            renderStations();
            setStatus(false, 'Demo mode', true);
        }

        function refreshData() { fetchData(); }
        function changeRegion(r) {
            currentRegion = r;
            fetchData();
        }

        function changeMapType(type) {
            mapType = type;
            // Clear existing tile layers
            map.eachLayer(layer => {
                if (layer instanceof L.TileLayer) {
                    map.removeLayer(layer);
                }
            });
            if (mapType === 'vietmap') {
                loadVietmapLayer();
            } else if (mapType === 'bing') {
                loadBingMapsLayer();
            } else if (mapType === 'azure') {
                loadAzureMapsLayer();
            } else {
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© <a href="https://openstreetmap.org" target="_blank" rel="noopener">OpenStreetMap</a> contributors | Bản đồ: © OpenStreetMap',
                    maxZoom: 19
                }).addTo(map);
            }
        }

        function centerMap() {
            if (buses.length > 0) {
                const bounds = buses
                    .filter(b => b.lat && b.lng)
                    .map(b => [b.lat, b.lng]);
                if (bounds.length > 0) {
                    map.fitBounds(bounds, { padding: [60, 60] });
                    return;
                }
            }
            if (stations.length > 0) {
                const bounds = stations
                    .filter(s => s.lat && s.lng)
                    .map(s => [s.lat, s.lng]);
                if (bounds.length > 0) {
                    map.fitBounds(bounds, { padding: [60, 60] });
                    return;
                }
            }
            map.setView([21.0285, 105.8542], 13);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            setTimeout(() => map.invalidateSize(), 100);
        });

        // ============ Start ============
        fetchData();
        setInterval(fetchData, 30000);
    </script>
</body>
